[project]
name = "firstpair-tursolite"
version = "0.2.0"
description = "One embedded SQL interface over SQLite and Turso, with MVCC where Turso offers it"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
turso = ["pyturso==0.8.3"]

[dependency-groups]
dev = ["pytest==9.0.1", "pyturso==0.8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["firstpair_tursolite"]
